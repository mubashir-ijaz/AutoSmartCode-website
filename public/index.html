  <!-- ===================== Preloader =====================
       Inline on purpose: this has to paint on the first frame, before the JS
       bundle arrives. Anything imported through React would appear after the
       thing it's meant to cover.

       It animates the logo's own idea — scattered data resolving into one
       clean structured row — rather than a generic spinner.

       Three rules it must never break:
       1. It never adds artificial delay. It's dismissed the moment React
          mounts (src/index.js), not after a fixed timer.
       2. It shows once per session. Returning to the site from a new tab is
          instant; only a genuine cold visit sees it.
       3. If JavaScript never runs, the CSS failsafe hides it anyway — a
          preloader that can trap a visitor on a blank screen is a bug, not a
          brand moment. -->
  <style>
    .asc-pre {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: #060a09;
      /* Failsafe: hides itself even if the bundle never loads. */
      animation: asc-failsafe 0s linear 6s forwards;
    }
    .asc-pre::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(620px 420px at 50% 42%, rgba(16, 185, 129, 0.10), transparent 70%),
        radial-gradient(420px 300px at 50% 58%, rgba(6, 182, 212, 0.06), transparent 70%);
    }
    .asc-pre-inner {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 1.4rem;
      animation: asc-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .asc-pre-mark {
      width: 88px; height: 88px;
      filter: drop-shadow(0 12px 34px rgba(16, 185, 129, 0.34));
      animation: asc-breathe 2.4s ease-in-out 0.7s infinite;
    }
    /* Brackets draw themselves on. pathLength normalises both paths to 100. */
    .asc-bracket {
      stroke-dasharray: 100; stroke-dashoffset: 100;
      animation: asc-draw 0.85s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
    }
    /* The scattered data points, arriving out of order — as they do. */
    .asc-dot { opacity: 0; animation: asc-pop 0.44s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .asc-dot-1 { animation-delay: 0.62s; }
    .asc-dot-2 { animation-delay: 0.50s; }
    .asc-dot-3 { animation-delay: 0.74s; }
    /* …resolving into one clean row. */
    .asc-row { transform-origin: 24px 31.3px; transform: scaleX(0); animation: asc-resolve 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.92s forwards; }

    .asc-pre-name {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      font-size: 1.32rem; font-weight: 800; letter-spacing: -0.02em; color: #fff;
      opacity: 0; animation: asc-rise 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }
    .asc-pre-name span { color: #34d399; }

    .asc-pre-bar {
      width: 132px; height: 2px; border-radius: 2px;
      background: rgba(255, 255, 255, 0.08); overflow: hidden;
      opacity: 0; animation: asc-fade 0.5s ease 0.72s both;
    }
    .asc-pre-bar i {
      display: block; width: 42%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #34d399, #06b6d4, transparent);
      animation: asc-sweep 1.15s cubic-bezier(0.65, 0, 0.35, 1) 0.8s infinite;
    }

    /* Exit — the site is already painted underneath, so this lifts away. */
    .asc-pre-done { animation: asc-exit 0.5s cubic-bezier(0.65, 0, 0.35, 1) forwards; pointer-events: none; }

    @keyframes asc-draw    { to { stroke-dashoffset: 0; } }
    @keyframes asc-pop     { 0% { opacity: 0; transform: translateY(-5px) scale(0.4); } 100% { opacity: 1; transform: none; } }
    @keyframes asc-resolve { to { transform: scaleX(1); } }
    @keyframes asc-rise    { from { opacity: 0; transform: translateY(11px); } to { opacity: 1; transform: none; } }
    @keyframes asc-fade    { from { opacity: 0; } to { opacity: 1; } }
    @keyframes asc-sweep   { 0% { transform: translateX(-115%); } 100% { transform: translateX(340%); } }
    @keyframes asc-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes asc-exit    { to { opacity: 0; transform: scale(1.06); visibility: hidden; } }
    @keyframes asc-failsafe { to { opacity: 0; visibility: hidden; } }

    /* Respect the OS setting. Motion sickness outranks a brand moment. */
    @media (prefers-reduced-motion: reduce) {
      .asc-pre, .asc-pre * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      .asc-bracket { stroke-dashoffset: 0; }
      .asc-dot { opacity: 1; }
      .asc-row { transform: scaleX(1); }
      .asc-pre-done { opacity: 0; visibility: hidden; }
    }
  </style>

<body>
  <div class="asc-pre" id="asc-preloader" role="presentation" aria-hidden="true">

  <script>
    /* Once per session. A splash on every internal cold load is an obstacle,
       not a brand moment — removed before first paint so there's no flash. */
    try {
      if (sessionStorage.getItem("asc-splash")) {
        var p = document.getElementById("asc-preloader");
        if (p) p.parentNode.removeChild(p);
      } else {
        sessionStorage.setItem("asc-splash", "1");
      }
    } catch (e) { /* private mode — just show it */ }
  </script>

  <div id="root"></div>
