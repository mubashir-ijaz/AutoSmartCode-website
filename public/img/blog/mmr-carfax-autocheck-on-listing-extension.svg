  <text x="140" y="596" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="500" fill="#64748b">autosmartcode.com</text>
  <text x="1120" y="582" text-anchor="end" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="600" fill="#34d399">Built by Sam</text>
