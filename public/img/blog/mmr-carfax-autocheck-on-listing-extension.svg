<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080f0d"/>
      <stop offset="55%" stop-color="#060a09"/>
      <stop offset="100%" stop-color="#0a1512"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/><stop offset="55%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.62">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="6" fill="url(#accent)"/>

  <rect x="80" y="86" width="212" height="44" rx="22" fill="#34d399" fill-opacity="0.13" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="186" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="700" fill="#34d399" letter-spacing="1.6">DEALER TOOLS</text>

  <g>
    <rect x="1032" y="62" width="88" height="88" rx="24" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.32"/>
    <!-- fill is ignored by a colour emoji font (browsers, viewing the SVG) and
         honoured by a monochrome one (the build host, rasterising to PNG), so
         the glyph stays legible on the dark card either way. -->
    <text x="1076" y="130" text-anchor="middle" font-size="52" fill="#ffffff" fill-opacity="0.92">🧩</text>
  </g>

  <text x="80" y="191" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1.1">Stop Copying VINs: See MMR,</text>
    <text x="80" y="268" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1.1">Carfax and AutoCheck on the</text>
    <text x="80" y="345" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-1.1">Auction Listing Itself</text>

  <text x="80" y="456" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="25" font-weight="500" fill="#94a3b8">The copy-VIN, open-tab, paste, come-back loop costs a buyer hours a week. How</text>
  <text x="80" y="492" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="25" font-weight="500" fill="#94a3b8">a custom browser extension reads the VIN off the page and shows MMR,…</text>

  <line x1="80" y1="524" x2="1120" y2="524" stroke="#ffffff" stroke-opacity="0.09"/>
  
  <g transform="translate(80 550) scale(0.9167)">
